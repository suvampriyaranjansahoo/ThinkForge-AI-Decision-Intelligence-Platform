services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: thinkforge
      POSTGRES_USER: thinkforge
      POSTGRES_PASSWORD: thinkforge-local-only
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thinkforge -d thinkforge"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  web:
    build: ./backend
    command: sh -c "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    env_file: ./backend/.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: thinkforge-local-only
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes: [./backend:/app]
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
  worker:
    build: ./backend
    command: celery -A config worker --loglevel=INFO
    env_file: ./backend/.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: thinkforge-local-only
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes: [./backend:/app]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
volumes:
  postgres_data:
