<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ThinkForge Evaluation Lab</title><style>body{font:14px system-ui;max-width:1100px;margin:24px auto;padding:0 16px;background:#f6f7fb;color:#182033}.card{background:white;border:1px solid #ddd;border-radius:14px;padding:18px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field{display:grid;gap:6px;margin-bottom:10px}textarea,input,select{padding:9px;border:1px solid #ccc;border-radius:8px;font:inherit}button{padding:10px 14px;border:0;border-radius:9px;background:#4f46e5;color:#fff;font-weight:700;cursor:pointer}.muted{color:#667085}.output{background:#0f172a;color:#e5e7eb;padding:14px;border-radius:12px;white-space:pre-wrap;overflow:auto;max-height:520px}.bad{background:#fff1f2;border:1px solid #fecdd3;padding:10px;border-radius:10px}.good{background:#ecfdf3;border:1px solid #a7f3d0;padding:10px;border-radius:10px}@media(max-width:720px){.grid{grid-template-columns:1fr}}</style></head><body><h1>ThinkForge Human Evaluation Lab</h1><p class="muted">Independent evaluation only. Candidate outputs are frozen per case before annotation. Do not mark a case as expert-gold from a single rating.</p><div class="card"><div class="grid"><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Password</label><input id="password" type="password"></div></div><button id="signin">Sign in</button> <button id="signup">Create evaluator account</button> <span id="auth" class="muted"></span></div><div id="app"></div><script type="module">
let supa=null,token=null,cases=[],i=0,currentCase=null;
async function init(){const cfg=await fetch('/api/config').then(r=>r.json());if(!cfg.supabaseUrl||!cfg.supabaseAnonKey){document.getElementById('auth').textContent='Supabase is not configured.';return}const mod=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');supa=mod.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);const sess=(await supa.auth.getSession()).data.session;if(sess){token=sess.access_token;document.getElementById('auth').textContent='Signed in';await loadCases()}}
async function auth(mode){if(!supa)return;const email=document.getElementById('email').value,password=document.getElementById('password').value;const r=mode==='signup'?await supa.auth.signUp({email,password}):await supa.auth.signInWithPassword({email,password});if(r.error){document.getElementById('auth').textContent=r.error.message;return}const sess=(await supa.auth.getSession()).data.session;token=sess?.access_token||null;document.getElementById('auth').textContent=token?'Signed in':'Check email for confirmation';if(token)await loadCases()}
async function api(body){return fetch('/api/annotations',{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},body:JSON.stringify(body)})}
async function loadCases(){const r=await api({action:'list'});const j=await r.json();cases=j.cases||[];render()}
async function next(){const meta=cases[i];const scores={};for(const d of currentCase.rubric.dimensions[currentCase.case.module])scores[d]=Number(document.getElementById(d).value);const claimLabels=[];document.querySelectorAll('.claim-row').forEach(el=>claimLabels.push({claimId:el.dataset.claimId,label:el.querySelector('.claim-label').value,evidenceIds:(el.querySelector('.claim-evidence').value||'').split(',').map(x=>x.trim()).filter(Boolean),note:el.querySelector('.claim-note').value}));const r=await api({action:'submit',caseId:currentCase.case.id,presentationId:meta.presentationId,scores,claimLabels,confidence:Number(document.getElementById('confidence').value),notes:document.getElementById('notes').value,rubricVersion:currentCase.rubric.version});const j=await r.json();if(!r.ok){alert(j.error||'Failed');return}i++;render()}
async function render(){const app=document.getElementById('app');if(!token){app.innerHTML='<div class="card bad">Sign in as an evaluator to begin.</div>';return}if(i>=cases.length){app.innerHTML='<div class="card good"><strong>All cases reviewed in this session.</strong></div>';return}const meta=cases[i];app.innerHTML='<div class="card">Loading frozen candidate and rubric…</div>';const r=await api({action:'get',caseId:meta.id,presentationId:meta.presentationId});const j=await r.json();if(!r.ok){app.innerHTML=`<div class="card bad">${j.error||'Could not load case'}</div>`;return}currentCase=j;const d=j.case.decision||{},ev=(d.evidence||[]).map(e=>`<div class="card"><b>${e.source||e.type||'Evidence'}</b><p>${e.content||''}</p><small>${e.stance||'neutral'} · ${e.strength||'unknown'}</small></div>`).join('');app.innerHTML=`<div class="card"><b>${j.case.id}</b> · ${j.case.module} · ${j.case.difficulty} · ${j.case.domain||'general'} · Case ${i+1}/${cases.length}<h2>${d.title||''}</h2><p><b>Problem:</b> ${d.problem||''}</p><p><b>Prompt:</b> ${j.case.input_prompt||''}</p></div>${ev}<div class="card"><h3>Frozen candidate output</h3><p class="muted">Model: ${j.candidate.model} · Prompt: ${j.candidate.promptVersion} · Retriever: ${j.candidate.retrieverVersion}</p><div class="output">${JSON.stringify(j.candidate.output,null,2)}</div></div><div class="card"><h3>Rubric anchors</h3>${j.rubric.dimensions[j.case.module].map(k=>{const a=j.rubric.anchors?.[k]||{};return `<div class="card"><b>${k.replaceAll('_',' ')}</b><p><b>1:</b> ${a['1']||''}</p><p><b>3:</b> ${a['3']||''}</p><p><b>5:</b> ${a['5']||''}</p></div>`}).join('')}</div><div class="card"><h3>Independent score</h3><div class="grid">${j.rubric.dimensions[j.case.module].map(k=>`<div class="field"><label>${k.replaceAll('_',' ')}</label><select id="${k}">${[1,2,3,4,5].map(n=>`<option value="${n}">${n}</option>`).join('')}</select></div>`).join('')}</div><div class="field"><label>Confidence (1–5)</label><select id="confidence">${[1,2,3,4,5].map(n=>`<option value="${n}">${n}</option>`).join('')}</select></div><div class="card"><h4>Optional claim-level checks</h4><p class="muted">Use these for factual claims that materially affect the decision. Do not infer unsupported facts.</p><div class="field"><label>Claim ID</label><input id="claimId" placeholder="C1"></div><div class="field"><label>Claim label</label><select id="claimLabel"><option>SUPPORTED</option><option>PARTIALLY_SUPPORTED</option><option>UNSUPPORTED</option><option>CONTRADICTED</option><option>NOT_VERIFIABLE</option></select></div><div class="field"><label>Evidence IDs (comma-separated)</label><input id="claimEvidence" placeholder="E1,E4"></div><div class="field"><label>Claim note</label><input id="claimNote" maxlength="1000"></div><button id="addClaim" type="button">Add claim check</button><div id="claims"></div></div><div class="field"><label>Notes</label><textarea id="notes" maxlength="5000" rows="5"></textarea></div><button id="save">Submit annotation</button></div>`;document.getElementById('addClaim').onclick=()=>{const cid=document.getElementById('claimId').value.trim();if(!cid)return;const row=document.createElement('div');row.className='claim-row card';row.dataset.claimId=cid;row.innerHTML=`<b>${cid}</b><select class="claim-label"><option>SUPPORTED</option><option>PARTIALLY_SUPPORTED</option><option>UNSUPPORTED</option><option>CONTRADICTED</option><option>NOT_VERIFIABLE</option></select><input class="claim-evidence" placeholder="E1,E4" value="${document.getElementById('claimEvidence').value}"><input class="claim-note" maxlength="1000" value="${document.getElementById('claimNote').value}"><button type="button">Remove</button>`;row.querySelector('.claim-label').value=document.getElementById('claimLabel').value;row.querySelector('button').onclick=()=>row.remove();document.getElementById('claims').appendChild(row);document.getElementById('claimId').value='';document.getElementById('claimEvidence').value='';document.getElementById('claimNote').value='';};document.getElementById('save').onclick=next}
document.getElementById('signin').onclick=()=>auth('signin');document.getElementById('signup').onclick=()=>auth('signup');init();
</script></body></html>
